name: Nettoyage quotidien

# Une fois par jour à 03h00 UTC (04h à Dakar ou 04h/05h en Europe l'été)
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install supabase==2.9.1 storage3==0.8.2 postgrest==0.17.2 structlog==24.4.0 python-dotenv==1.0.1

      - name: Lancer le nettoyage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python nettoyer_morceaux.py
